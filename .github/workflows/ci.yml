
name: CI

on:
  push:
    branches: [advanced]

jobs:
  frontend:
   # run on GitHub Runner
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v7

      - name: setup-nodeJs
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm packages
        run: npm install
        working-directory: frontend

      - name: Run Linter
        run: npm run lint
        working-directory: frontend
        

      - name: Run Tests
        run: npm run test
        working-directory: frontend

      - name: Docker setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe:latest

  backend:
      runs-on: ubuntu-latest
      steps:
        - name: checkout-code
          uses: actions/checkout@v7

        - name: setup-GO
          uses: actions/setup-go@v6
          with:
            go-version: '1.23'
            go-version-file: 'go.mod'
            cache-dependency-path: go.sum

        - name: Run Go formatter
          run: go fmt
          working-directory: backend

        - name: Run Go Vet
          run: go vet
          working-directory: backend
        

        - name: Run Tests in Go
          run: go test
          working-directory: backend

        - name: Docker setup [Login]
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Docker Build and push
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-be:latest

  deploy:
    needs: [frontend,backend]
    uses: ./.github/workflows/cd.yml
    secrets: inherit
