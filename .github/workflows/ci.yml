
name: CI

on:
  push:
    branch: [advanced]

jobs:
   frontend:
   # run on GitHub Runner
   runs-on: ubuntu-latest
   steps:
    - name: checkout-code
      uses: actions/checkout@v7

    - name: setup-nodeJs
      uses: actions/setup-node@v6
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install npm packages
      run: npm install

    - name: Run Linter
      run: npm run Lin

    - name: Run Tests
      run: npm run test
   backend: