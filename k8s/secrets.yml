# Secrets.yml file where we put all secrets which is encoded into BASE64

apiVersion: v1
kind: Secret
metadata:
  name: devboard-secret
  namespace: devboard
type: opaque
data:
  POSTGRES_USER: ZGV2Ym9hcmQ= # this is encoded username into base64
  POSTGRES_PASSWORD: ZGV2Ym9hcmQ= # this is encoded password into base64
  POSTGRES_DB: ZGV2Ym9hcmQ= # this is encoded postgress_DB into base64